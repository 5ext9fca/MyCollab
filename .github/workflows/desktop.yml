name: 桌面构建与 GUI 验收
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - 'desktop/**'
      - 'frontend/**'
      - 'local_runner/**'
      - 'backend/**'
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.target }} 构建与验收
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
            app: mac-arm64/MyCollab.app/Contents/MacOS/MyCollab
            executable: mycollab-runner
            packaged: mac-arm64/MyCollab.app/Contents/Resources/runner/mycollab-runner
          - os: macos-15-intel
            target: mac-x64
            app: mac/MyCollab.app/Contents/MacOS/MyCollab
            executable: mycollab-runner
            packaged: mac/MyCollab.app/Contents/Resources/runner/mycollab-runner
          - os: windows-2025
            target: win-x64
            app: win-unpacked/MyCollab.exe
            executable: mycollab-runner.exe
            packaged: win-unpacked/resources/runner/mycollab-runner.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装锁定依赖
        run: |
          npm ci --prefix desktop
          npm ci --prefix frontend
          python -m pip install PyInstaller==6.22.3
      - name: 桌面边界与子进程检查
        run: |
          npm --prefix desktop run electron:check
          npm --prefix desktop run electron:test
          python -m unittest discover -s desktop/scripts -p test_collect_release.py -v
      - name: 前端纯逻辑回归
        run: npm --prefix frontend run test -- src/tests/desktopAuth.spec.ts src/tests/client.spec.ts src/tests/missions.spec.ts src/tests/library.spec.ts src/tests/fileTransferProtocol.spec.ts src/tests/fileTransferController.spec.ts
      - name: 构建 Windows 测试模型 CLI（不接入供应商）
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name fixture-opencode --distpath desktop/build/fixture --workpath desktop/build/fixture-work --specpath desktop/build local_runner/tests/fixtures/opencode.py
          python -c "import os; from pathlib import Path; p=Path('desktop/build/fixture/fixture-opencode.exe').resolve(); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('MYCOLLAB_TEST_OPENCODE_BINARY=' + str(p) + '\n')"
      - name: Runner 完整非 GUI 回归
        run: python -m unittest discover -s local_runner/tests -v
      - name: 构建并验证原生 Runner
        run: |
          python desktop/scripts/build_sidecar.py --electron
          python desktop/scripts/check_runner.py desktop/build/runner/${{ matrix.target }}/${{ matrix.executable }}
      - name: 独立 Runner 断线恢复与宿主退出
        run: |
          export MYCOLLAB_TEST_RUNNER_BINARY="$(python -c "from pathlib import Path; print(Path('desktop/build/runner/${{ matrix.target }}/${{ matrix.executable }}').resolve())")"
          python -m unittest local_runner.tests.test_delivery_integration local_runner.tests.test_control_pipe.ControlPipeTests.test_diagnosis_does_not_wait_for_control_pipe_eof -v
      - name: 构建开发安装包（不安装或启动窗口）
        id: development_package
        run: npm --prefix desktop run electron:dist:dev
      - name: 验证实际包内 Runner
        run: python desktop/scripts/check_runner.py desktop/build/electron/${{ matrix.packaged }}
      - name: 验证 macOS 开发签名完整性
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=$(find desktop/build/electron -maxdepth 2 -name MyCollab.app -type d)
          codesign --verify --deep --strict "$bundle"
      - name: 安装 GUI 验收依赖
        run: |
          python -m pip install -r backend/requirements.txt
          unset ELECTRON_SKIP_BINARY_DOWNLOAD
          npm --prefix desktop run electron:setup
      - name: 准备 macOS PostgreSQL 16
        if: runner.os == 'macOS'
        run: |
          brew install postgresql@16
          echo "$(brew --prefix postgresql@16)/bin" >> "$GITHUB_PATH"
      - name: 准备 Windows PostgreSQL 工具
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH $env:PGBIN
      - name: 真实 Electron GUI 隔离验收
        id: packaged_gui
        run: python desktop/tests/ci/check_gui.py --app "desktop/build/electron/${{ matrix.app }}"
      - name: Windows 开发安装与卸载验收
        id: installed_gui
        if: runner.os == 'Windows'
        run: python desktop/tests/ci/check_windows_install.py
      - name: 保存 GUI 截图与追踪
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-gui
          path: |
            frontend/test-results/desktop
            desktop/build/windows-install-validation.json
          retention-days: 7
          if-no-files-found: warn
      - name: 记录开发安装包来源与验收结果
        id: validation_manifest
        if: always() && steps.development_package.outcome == 'success'
        env:
          VALIDATION_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          VALIDATION_TARGET: ${{ matrix.target }}
          VALIDATION_PACKAGED_GUI: ${{ steps.packaged_gui.outcome }}
          VALIDATION_INSTALLED_GUI: ${{ steps.installed_gui.outcome }}
        run: python desktop/scripts/record_development_validation.py
      - name: 归档开发包并保留可执行权限
        id: development_archive
        if: always() && steps.validation_manifest.outcome == 'success'
        shell: bash
        run: tar -czf desktop-${{ matrix.target }}-development.tar.gz -C desktop/build/electron .
      - uses: actions/upload-artifact@v4
        if: always() && steps.development_archive.outcome == 'success'
        with:
          name: desktop-${{ matrix.target }}-development
          path: desktop-${{ matrix.target }}-development.tar.gz
          retention-days: 7
          if-no-files-found: error
