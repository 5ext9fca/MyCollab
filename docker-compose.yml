# Local development services (PostgreSQL for running the backend and its tests).
# Production stack lives in deploy/docker-compose.yml.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mycollab
      POSTGRES_USER: mycollab
      POSTGRES_PASSWORD: mycollab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mycollab -d mycollab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
