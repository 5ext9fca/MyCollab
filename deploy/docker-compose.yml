# 公共 MyCaddy -> 内部 Web（静态文件 + SPA）-> Gunicorn -> PostgreSQL。
# Usage:
#   cd deploy
#   cp .env.example .env   # then fill in the secrets
#   docker compose up -d --build
name: mycollab-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycollab}
      POSTGRES_USER: ${POSTGRES_USER:-mycollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mycollab} -d ${POSTGRES_DB:-mycollab}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://localhost}
      POSTGRES_DB: ${POSTGRES_DB:-mycollab}
      POSTGRES_USER: ${POSTGRES_USER:-mycollab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - static_data:/app/staticfiles
      # Uploaded files live here. Caddy never serves this directory; downloads
      # go through the authorized API endpoint (GET /api/library/files/{id}/).
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.caddy
    volumes:
      - static_data:/srv/static:ro
    networks:
      default:
      caddy:
        aliases:
          - mycollab-web
    depends_on:
      - backend
    restart: unless-stopped

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy-public}

volumes:
  db_data:
  static_data:
  media_data:
